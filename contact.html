<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page in Active Development</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09060f;
            --panel: rgba(24, 10, 34, 0.86);
            --primary: #f91477;
            --accent: #390064;
            --text: #ffffff;
            --muted: #f1d9eb;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Lexend', sans-serif;
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 14% 12%, rgba(249, 20, 119, 0.26), transparent 34%),
                radial-gradient(circle at 85% 78%, rgba(57, 0, 100, 0.34), transparent 44%),
                linear-gradient(145deg, #09060f, #10061d 54%, #130a21);
        }

        .card {
            width: min(760px, 94vw);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            padding: clamp(20px, 3vw, 34px);
            text-align: center;
            background: var(--panel);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(4px);
        }

        h1 {
            margin: 0 0 12px;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            font-weight: 800;
            font-size: clamp(1.4rem, 3.4vw, 2.5rem);
            color: #ffd9ec;
            text-shadow: 0 0 20px rgba(249, 20, 119, 0.35);
        }

        p {
            margin: 0;
            line-height: 1.5;
            color: var(--muted);
            font-size: clamp(0.98rem, 1.5vw, 1.16rem);
        }

        .actions {
            margin-top: clamp(18px, 2.6vw, 28px);
            display: flex;
            justify-content: center;
        }

        .go-intro {
            text-decoration: none;
            color: var(--text);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-radius: 999px;
            border: 2px solid #ffffff;
            background: linear-gradient(145deg, var(--primary), #cf0f63);
            padding: 11px 20px;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .go-intro:hover,
        .go-intro:focus-visible {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 22px rgba(249, 20, 119, 0.6);
            filter: saturate(1.05);
            outline: none;
        }
    </style>
</head>
<body>
    <main class="card" role="main" aria-label="Page status">
        <h1>Page Is in Active Development</h1>
        <p>This section is currently being built and updated.</p>
        <div class="actions">
            <a class="go-intro" href="/index.html">Back to Intro</a>
        </div>
    </main>
</body>
</html>
