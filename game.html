<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" type="image/x-icon" href="Covers/TimeIsNowLogo.png">

    <meta name="description" content="Adam Argam - Generalist Game Designer.">
    <meta name="keywords" content="Adam Argam, Generalist Game Designer, Game Design Portfolio">
    <meta name="author" content="Adam Argam">

    <meta name="twitter:title" content="Adam Argam - Generalist Game Designer">
    <meta name="twitter:description" content="Explore Adam Argam's game design world.">
    <meta name="twitter:image" content="Covers/TimeIsNowLogo.png">

    <title>Adam Argam - Generalist Game Designer</title>

    <link rel="stylesheet" href="game.css">
</head>
<body>
    <video class="background-video" autoplay muted loop playsinline>
        <source src="Videos/VideoGameReel50MB.mp4" type="video/mp4">
    </video>
    <div class="video-overlay" aria-hidden="true"></div>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="hero-shell">
        <h1 class="page-title">
            <span class="page-title-main">Adam Argam</span>
            <span class="page-title-sub">Generalist Game Designer</span>
        </h1>

        <section class="star-stage" aria-label="Profile introduction">
            <article id="star-card" class="star-card">
                <svg class="star-svg" viewBox="0 0 160 100" aria-hidden="true">
                    <polygon class="star-fill" points="80,-12 116,24 206,50 116,74 80,114 44,74 -46,50 44,24"></polygon>
                    <polygon class="star-stroke" pathLength="100" points="80,-12 116,24 206,50 116,74 80,114 44,74 -46,50 44,24"></polygon>
                </svg>

                <div class="star-content">
                    <img class="profile-icon" src="MijnFoto.jpg" alt="Portrait of Adam Argam">
                    <p class="summary-text"></p>
                    <button id="explore-btn" class="explore-btn" type="button">Explore</button>
                </div>

                <aside class="fact-bubble" aria-live="polite">
                    <span class="bubble-dot bubble-dot--1"></span>
                    <span class="bubble-dot bubble-dot--2"></span>
                    <span class="bubble-dot bubble-dot--3"></span>
                    <span class="bubble-dot bubble-dot--4"></span>
                    <span id="fact-text" class="fact-text">HAHAHA.</span>
                </aside>
            </article>
        </section>
    </main>

    <script src="game.js"></script>
</body>
</html>
