<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Removed</title>
    <style>
        :root {
            --bg: #010000;
            --primary: #f91477;
            --accent: #390064;
            --text: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at 20% 20%, rgba(249, 20, 119, 0.2), transparent 40%),
                        radial-gradient(circle at 80% 75%, rgba(57, 0, 100, 0.35), transparent 45%),
                        var(--bg);
            padding: 24px;
        }
        main {
            width: min(680px, 92vw);
            border: 2px solid rgba(255,255,255,0.9);
            border-radius: 18px;
            background: linear-gradient(150deg, rgba(57,0,100,0.72), rgba(20,0,40,0.78));
            padding: 28px;
            text-align: center;
            box-shadow: 0 14px 30px rgba(0,0,0,0.35);
        }
        h1 {
            margin: 0 0 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--primary);
        }
        p { margin: 0 0 18px; line-height: 1.5; }
        a {
            display: inline-block;
            text-decoration: none;
            color: var(--text);
            border: 2px solid #fff;
            border-radius: 999px;
            padding: 10px 16px;
            font-weight: 700;
            background: rgba(249,20,119,0.75);
        }
    </style>
</head>
<body>
    <main>
        <h1>Page Removed</h1>
        <p>This page has been cleared from the current site structure.</p>
        <a href="/Explore.html">Go to Explore</a>
    </main>
</body>
</html>
